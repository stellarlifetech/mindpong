</head><body>
<style id="gameCss">
/* Layout: one-screen game shell. Full-bleed animated scene canvas behind a centered column: top HUD, then a stage that swaps title / world map / cinematic intro / battle / results / report. Deliberately single dark theme: a night-sky quest world where each realm recolors the sky. */
:root{
  color-scheme: dark;
  --night:#0b0d1c; --night2:#11142a; --panel:#161a36; --panel2:#20254c; --line:#2f3566;
  --gold:#e9b949; --gold-dim:#a9842f; --crystal:#6fe0d6; --ember:#ff6b4a;
  --ink:#efe8d8; --mute:#a3a0c2; --ok:#5fd38a; --bad:#ff5d6c;
  --realm:#6fe0d6;
  --f-display:"Cinzel", "Trajan Pro", Georgia, serif;
  --f-body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:3px solid var(--crystal);outline-offset:2px}
#scene{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(1200px 600px at 80% -10%, color-mix(in srgb,var(--realm) 26%, transparent), transparent 60%),
    radial-gradient(900px 500px at 0% 110%, color-mix(in srgb,var(--gold) 10%, transparent), transparent 60%),
    linear-gradient(180deg,var(--night2),var(--night));}
.flash{position:fixed;inset:0;z-index:40;pointer-events:none;background:#fff;opacity:0}
.flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.shell{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:10px 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-block:6px 12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand{font-family:var(--f-display);font-weight:800;letter-spacing:.08em;color:var(--gold);font-size:17px;text-transform:uppercase}
.brand small{display:block;font-family:var(--f-body);font-weight:500;letter-spacing:.14em;color:var(--mute);font-size:11px}
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--f-mono);font-size:12.5px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:color-mix(in srgb,var(--panel) 85%,transparent);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip b{color:var(--gold);font-weight:500}
.iconbtn{background:color-mix(in srgb,var(--panel) 85%,transparent);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--mute)}
.vol{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}.vol input{width:90px;height:32px;accent-color:var(--gold);cursor:pointer}
.pausebar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-color:var(--gold-dim);margin-bottom:14px}
.adm{display:grid;gap:12px}.adm h3{font-size:17px;color:var(--gold)}.adm .line{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.adm input,.adm select{padding:9px 10px;border-radius:7px;border:1px solid var(--line);background:var(--night);color:var(--ink);font-size:15px;min-width:0;flex:1 1 180px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--panel2);border:1px solid var(--gold-dim);color:var(--ink);padding:10px 16px;border-radius:10px;max-width:min(92vw,560px);text-align:center;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.credits{display:flex;gap:16px;align-items:center;max-width:760px;width:100%;margin-top:10px;padding-top:18px;border-top:1px solid var(--line);text-align:left}
.credits img{flex:0 0 auto;width:96px;height:96px;filter:drop-shadow(0 0 14px rgba(233,185,73,.25))}
.credits div{display:grid;gap:4px;min-width:0}.credits p{margin:0;font-size:13.5px;color:var(--mute);overflow-wrap:anywhere}
.credits a{color:var(--gold)}
@media (max-width:520px){.credits{flex-direction:column;text-align:center}}
.emb{position:relative;display:inline-block;flex:0 0 auto;border-radius:50%;filter:drop-shadow(0 0 12px color-mix(in srgb,var(--c) 55%,transparent))}
.emb canvas{position:absolute;inset:0;border-radius:50%}
.emb svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.emb .e-spin,.emb .e-spinr{transform-box:view-box;transform-origin:50px 50px}
.emb .e-spin{animation:espin 40s linear infinite}.emb .e-spinr{animation:espin 9s linear infinite reverse}
@keyframes espin{to{transform:rotate(360deg)}}
.cls[aria-pressed=true] .emb{filter:drop-shadow(0 0 22px var(--c))}.cls[aria-pressed=true] .emb .e-spin{animation-duration:14s}
.cls{position:relative;overflow:hidden}.cls::after{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent 0 70%,color-mix(in srgb,var(--c) 22%,transparent) 80%,transparent 90%);animation:espin 7s linear infinite;opacity:0;transition:opacity .3s;pointer-events:none}
.cls[aria-pressed=true]::after,.cls:hover::after{opacity:1}
.cls > *{position:relative;z-index:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.tab{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--mute)}
.tab[aria-selected=true]{color:#1b1404;background:var(--gold);border-color:var(--gold);font-weight:700}
.orgs{display:grid;gap:6px}.org{display:grid;gap:2px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--night2)}
.warn{color:var(--ember)!important}
.who{display:grid;gap:8px;margin-top:8px}
.whohit{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;padding:10px 12px;border:1px solid var(--gold-dim);border-radius:10px;background:rgba(233,185,73,.08);animation:pop .3s ease-out}
.whohit .emj{color:var(--gold);font-size:18px}.whohit .tag{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.whohit.on{border-color:var(--ok);box-shadow:0 0 0 2px rgba(95,211,138,.3)}.whohit.on .tag{color:var(--ok)}
.adm code{font-family:var(--f-mono);font-size:12.5px;color:var(--gold)}
.lhero{position:relative;width:100%;display:grid;place-items:center;padding-block:56px 40px}
.lhero h1{position:relative;z-index:1}
.logo{background:linear-gradient(110deg,#8c6620 0%,#e9b949 28%,#fff7d6 44%,#e9b949 58%,#8c6620 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite,glint 6s ease-in-out infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-140% 0}}
.lhero .logo{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:#e9b949;animation:glint 6s ease-in-out infinite}
.lhero .logo .ch{display:inline-block;color:transparent;background:linear-gradient(110deg,#a77a24 0%,#e9b949 35%,#fff7d6 50%,#e9b949 65%,#a77a24 100%);background-size:300% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;
  animation:chIn 1s cubic-bezier(.2,.8,.2,1) var(--d) both,chShine 6s ease-in-out calc(var(--d) + 1.2s) infinite}
@keyframes chShine{0%,55%{background-position:100% 0}80%,100%{background-position:0% 0}}
@keyframes chIn{from{opacity:0;transform:translateY(24px) scale(.6)}to{opacity:1;transform:none}}
.portals{display:flex;flex-wrap:wrap;justify-content:center;column-gap:clamp(14px,2.4vw,20px);row-gap:30px;max-width:900px;padding-bottom:14px}
.portal{position:relative;width:clamp(50px,9vw,72px);aspect-ratio:1;max-width:100%;display:grid;place-items:center;animation:portalIn .8s cubic-bezier(.2,.9,.3,1.3) var(--d) both}
.pr-ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,var(--c),transparent 30%,var(--c) 50%,transparent 80%,var(--c));-webkit-mask:radial-gradient(circle,transparent 58%,#000 60%);mask:radial-gradient(circle,transparent 58%,#000 60%);animation:espin 4s linear infinite;filter:drop-shadow(0 0 8px var(--c))}
.pr-core{position:absolute;inset:12%;border-radius:50%;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--c) 55%,#fff 10%),color-mix(in srgb,var(--c) 25%,#05060f) 60%,#05060f);box-shadow:inset 0 0 18px #000}
.pr-ico{position:relative;font-size:clamp(20px,3.6vw,30px);animation:float 3s ease-in-out infinite;animation-delay:var(--d)}
.pr-l{position:absolute;bottom:-20px;font-family:var(--f-mono);font-size:11px;letter-spacing:.02em;color:var(--ink);opacity:.8;white-space:nowrap}
.portal:hover .pr-ring{animation-duration:1.2s}
@keyframes portalIn{from{opacity:0;transform:scale(.2) rotate(-90deg)}to{opacity:1;transform:none}}
.vbox{border:1px solid var(--line);border-radius:10px;background:var(--panel);text-align:left}
.vbox summary{cursor:pointer;padding:12px 14px;font-weight:700;color:var(--gold);list-style-position:inside}
.vbox .vbody{display:grid;gap:10px;padding:0 14px 14px}
.modrep{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}.modlist .modrep{justify-content:flex-start}
.vsample{display:grid;gap:8px;padding-top:12px;border-top:1px solid var(--line)}.vsample > div{display:grid;gap:2px}.vsample .btn{justify-self:start}
.vres{display:grid;gap:4px;padding:12px;border-radius:8px;margin:0}
.vres.good{border:1px solid var(--ok);background:rgba(95,211,138,.12)}.vres.good strong{color:var(--ok);font-size:18px}
.vres.bad{border:1px solid var(--bad);background:rgba(255,93,108,.1);color:var(--bad)}
.vline{display:grid;gap:6px;text-align:left}.vline code{font-family:var(--f-mono);font-size:12.5px;padding:10px;border:1px dashed var(--gold-dim);border-radius:8px;background:var(--night);overflow-wrap:anywhere;user-select:all}
.qcount{width:100%;max-width:900px;display:grid;gap:14px}
.qc-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.qc-stats div{padding:12px;border:1px solid var(--gold-dim);border-radius:10px;background:radial-gradient(160px 80px at 50% 0%,rgba(233,185,73,.14),transparent 70%),var(--panel)}
.qc-stats b{display:block;font-family:var(--f-mono);font-size:28px;color:var(--gold);font-variant-numeric:tabular-nums}
.qc-stats span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.qc-days{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;text-align:left}
.qc-day{display:grid;gap:6px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.qc-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:14.5px}
.qc-h{font-family:var(--f-mono);color:var(--crystal);font-size:12px;white-space:nowrap}.qc-n{min-width:0}.qc-n small{display:block;color:var(--mute);font-size:12.5px}
.qc-q{font-family:var(--f-mono);color:var(--gold);font-size:13px;white-space:nowrap}
.gate{position:fixed;inset:0;z-index:60;display:grid;place-items:center;text-align:center;cursor:pointer;padding:16px;
  background:radial-gradient(60% 50% at 50% 45%,rgba(233,185,73,.16),transparent 70%),radial-gradient(120% 90% at 50% 120%,rgba(111,224,214,.12),transparent 60%),rgba(6,7,16,.975);transition:opacity .8s,transform .8s}
.gate.out{opacity:0;transform:scale(1.06);pointer-events:none}
.gate-inner{display:grid;gap:16px;justify-items:center}
.gate-logo{font-family:var(--f-display);font-weight:800;font-size:clamp(44px,10vw,96px)}
.gate-cta{margin-top:10px;font-family:var(--f-display);font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-size:clamp(15px,2.4vw,20px);padding:14px 26px;border:1px solid var(--gold-dim);border-radius:999px;animation:gatePulse 2.2s ease-in-out infinite}
@keyframes gatePulse{50%{box-shadow:0 0 0 10px rgba(233,185,73,0),0 0 40px rgba(233,185,73,.35);transform:scale(1.04)}0%,100%{box-shadow:0 0 0 0 rgba(233,185,73,.35)}}
.iconbtn:hover{color:var(--ink);border-color:var(--gold-dim)}
.iconbtn[aria-pressed=true]{color:var(--ink);border-color:var(--gold-dim)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);font-weight:700}
.note{font-size:14px;color:var(--mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--gold);background:linear-gradient(180deg,#f3cf6b,var(--gold) 55%,#c5952f);color:#1b1404;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:14px;padding:12px 20px;border-radius:6px;box-shadow:0 0 0 3px rgba(233,185,73,.15),0 8px 24px rgba(233,185,73,.18);transition:transform .12s, box-shadow .12s;min-height:44px}
.btn:hover{transform:translateY(-1px);box-shadow:0 0 0 4px rgba(233,185,73,.25),0 10px 28px rgba(233,185,73,.28)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--gold);box-shadow:none}
.btn.danger{border-color:var(--bad);background:transparent;color:var(--bad);box-shadow:none}
.btn.small{padding:8px 12px;font-size:12px;min-height:36px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.panel{background:linear-gradient(180deg,color-mix(in srgb,var(--panel2) 92%,transparent),color-mix(in srgb,var(--panel) 92%,transparent));border:1px solid var(--line);border-radius:12px;padding:18px}

/* Title */
.title-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;justify-items:center;text-align:center;padding-block:20px}
.title-wrap > *{max-width:100%;min-width:0}
.logo{font-size:clamp(38px,8vw,76px);font-weight:800;letter-spacing:.05em;line-height:1;
  background:linear-gradient(180deg,#fff3c9,var(--gold) 55%,#8c6620);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 26px rgba(233,185,73,.4));animation:glint 6s ease-in-out infinite}
@keyframes glint{50%{filter:drop-shadow(0 4px 40px rgba(233,185,73,.7))}}
.credit{font-family:var(--f-display);color:var(--ink);font-size:15px;letter-spacing:.06em;line-height:1.5}.credit span{color:var(--gold)}
.dayhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:18px 0 10px}.dayhead h3{font-size:20px;color:var(--gold)}
.tagline{max-width:58ch;color:var(--mute);font-size:18px;margin:0}
.form{width:100%;max-width:640px;display:grid;gap:16px;text-align:left}
.form label{font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.form input[type=text]{width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--night);color:var(--ink);font-size:18px;font-family:var(--f-body);margin-top:6px}
.classes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:6px}
.cls{border:1px solid var(--line);background:var(--night2);border-radius:10px;padding:16px 14px;text-align:center;justify-items:center;align-content:start;display:grid;gap:6px;transition:border-color .15s, transform .15s}
.cls:hover{transform:translateY(-2px)}
.cls[aria-pressed=true]{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 40%,transparent),0 0 24px color-mix(in srgb,var(--c) 30%,transparent)}
.sig{display:inline-block;width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,var(--c) 45%,transparent 70%);box-shadow:0 0 18px var(--c)}
.cls strong{font-family:var(--f-display);font-size:17px}
.cls span{font-size:14px;color:var(--mute)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;width:100%;max-width:900px}
.rule{padding:12px 14px;border-left:2px solid var(--gold-dim);text-align:left;font-size:15px;color:var(--mute);background:color-mix(in srgb,var(--night) 50%,transparent)}
.rule strong{display:block;color:var(--ink);font-size:16px}

/* Map */
.map-head{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.map-head h2{font-size:clamp(24px,4vw,34px);color:var(--gold)}
.progress{display:flex;gap:6px;align-items:center}
.progress i{width:24px;height:6px;border-radius:3px;background:var(--line)}
.progress i.done{background:var(--gold)}
.realms{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}
.realm{position:relative;text-align:left;border:1px solid var(--line);border-radius:12px;padding:16px;min-height:196px;display:flex;flex-direction:column;gap:7px;overflow:hidden;
  background:radial-gradient(260px 170px at 100% 0%, color-mix(in srgb,var(--c) 32%,transparent),transparent 70%),linear-gradient(180deg,var(--panel2),var(--panel));transition:transform .15s,border-color .15s,box-shadow .15s}
.realm:not([disabled]):hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 10px 30px color-mix(in srgb,var(--c) 25%,transparent)}
.realm[disabled]{cursor:not-allowed;filter:grayscale(.85) brightness(.65)}
.realm .hr{font-family:var(--f-mono);font-size:12px;color:var(--c);letter-spacing:.08em}
.realm h3{font-size:18px;line-height:1.15;padding-right:46px}
.realm .topic{font-size:14px;color:var(--mute);padding-right:46px}
.realm .boss{position:absolute;right:10px;top:12px;font-size:42px;filter:drop-shadow(0 0 12px var(--c));animation:float 3.4s ease-in-out infinite}
.realm .foot{margin-top:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pips{display:flex;gap:4px}
.pips i{width:12px;height:12px;border-radius:50%;border:1px solid var(--mute)}
.pips i.used{background:var(--mute)} .pips i.final{background:var(--gold);border-color:var(--gold);box-shadow:0 0 8px var(--gold)}
.status{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--night);border:1px solid var(--line)}
.status.final{color:var(--gold);border-color:var(--gold-dim)} .status.choose{color:var(--ember);border-color:var(--ember)} .status.ready{color:var(--crystal);border-color:var(--crystal)}
.pct{font-family:var(--f-mono);font-size:13px;color:var(--ink)}
.hall-cta{margin-top:20px;display:flex;justify-content:center}

/* Modal */
.modal-bg{position:fixed;inset:0;z-index:20;background:rgba(5,6,14,.74);display:grid;place-items:center;padding:16px;backdrop-filter:blur(3px)}
.modal{max-width:580px;width:100%;max-height:calc(100% - 24px);overflow:auto;display:grid;gap:12px;border-color:var(--c, var(--line))}
.modal .boss-big{font-size:68px;text-align:center;filter:drop-shadow(0 0 22px var(--c));animation:float 3s ease-in-out infinite}
.modal ul{margin:0;padding-left:20px;color:var(--mute)}
.attempts{display:grid;gap:8px}
.att{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--night2)}
.att .n{font-family:var(--f-mono);color:var(--mute);font-size:13px}
.att .s{font-family:var(--f-mono);font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.att .d{font-size:13px;color:var(--mute)}
.att.is-final{border-color:var(--gold);box-shadow:0 0 0 2px rgba(233,185,73,.25)}
.avg{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--mute)}
.avg b{font-family:var(--f-mono);color:var(--gold);font-size:16px;font-weight:500}

/* Cinematic intro */
.cine{position:fixed;inset:0;z-index:25;display:grid;place-items:center;text-align:center;overflow:hidden;
  background:radial-gradient(70% 60% at 50% 45%, color-mix(in srgb,var(--realm) 30%,transparent), transparent 70%),rgba(4,5,12,.9)}
.cine .lbox{position:absolute;left:0;right:0;height:12vh;background:#000;z-index:2;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.cine .lbox.top{top:0;transform:translateY(-100%)} .cine .lbox.bot{bottom:0;transform:translateY(100%)}
.cine.on .lbox{transform:none}
.cine .inner{position:relative;z-index:3;display:grid;gap:14px;justify-items:center;padding:16px;max-width:760px}
.cine .hourtag{font-family:var(--f-mono);letter-spacing:.4em;color:var(--realm);font-size:14px;opacity:0;transition:opacity .6s}
.cine .rname{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,7vw,64px);color:var(--ink);text-shadow:0 0 30px var(--realm);min-height:1.1em}
.cine .lore{max-width:56ch;color:var(--mute);font-size:18px;opacity:0;transition:opacity .8s}
.cine .bossreveal{font-size:clamp(100px,22vw,170px);line-height:1;filter:brightness(0) drop-shadow(0 0 30px var(--realm));transform:scale(.4);opacity:0;transition:transform 1.1s cubic-bezier(.2,.9,.2,1.2),opacity .6s,filter .25s}
.cine .bossreveal.up{transform:scale(1);opacity:1}
.cine .bossreveal.lit{filter:drop-shadow(0 0 40px var(--realm))}
.cine .bname{font-family:var(--f-display);font-size:clamp(22px,4vw,34px);color:var(--realm);opacity:0;transition:opacity .5s;letter-spacing:.06em}
.cine .vs{font-family:var(--f-display);font-weight:800;color:var(--gold);letter-spacing:.3em;opacity:0;transition:opacity .4s}
.cine .quote{font-style:italic;color:var(--ink);opacity:0;transition:opacity .5s;max-width:46ch}
.cine .show{opacity:1}
.cine .skip{position:absolute;right:16px;bottom:calc(12vh + 12px);z-index:4}
.cine .go{opacity:0;transition:opacity .4s} .cine .go.show{opacity:1}

/* Battle */
.arena{display:grid;gap:12px}
.stage{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:240px;
  background:radial-gradient(500px 220px at 50% 35%, color-mix(in srgb,var(--realm) 32%,transparent), transparent 70%),linear-gradient(180deg,rgba(14,17,48,.92),rgba(9,11,24,.95));
  display:grid;grid-template-rows:auto 1fr auto;padding:12px 14px;transition:box-shadow .5s}
.stage.enraged{box-shadow:inset 0 0 80px rgba(255,40,60,.45),0 0 0 1px rgba(255,80,90,.6);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:inset 0 0 120px rgba(255,40,60,.6),0 0 0 1px rgba(255,80,90,.8)}}
.stage-top{display:flex;justify-content:space-between;gap:10px;align-items:start;flex-wrap:wrap}
.bossname{font-family:var(--f-display);font-size:17px}
.bar{height:12px;border-radius:6px;background:#2a1020;border:1px solid #57203a;overflow:hidden;width:min(320px,62vw);margin-top:4px}

})();


/* =========================================================
   CLASS EMBLEMS — live cosmic scenes inside a medieval astrolabe
   Lifeweaver: emerald spiral galaxy · Arcanist: star-forming nebula with
   Webb-style six-point stars · Sunblade: black hole with accretion disk and jets
   ========================================================= */
const Cosmos=(function(){
  const live=new Set();let raf=0,t0=performance.now();

    const st={type,S,stars:[],clouds:[],spikes:[]};

      for(let i=0;i<900;i++){const arm=i%2,r=Math.pow(Math.random(),1.6)*.46+.02;
        const th=arm*Math.PI+r*9+rnd(-.35,.35)*(1-r)+rnd(-.12,.12);

        st.stars.push({r,th,arm,sz:rnd(.4,1.3)*(hii?1.8:1),c:r<.08?[255,240,200]:hii?[255,120,190]:Math.random()<.6?[110,255,180]:[150,220,255],a:rnd(.35,1),z:rnd(-.02,.02)})}
    }else if(type==='arcanist'){
      for(let i=0;i<9;i++)st.clouds.push({x:rnd(.15,.85),y:rnd(.2,.85),r:rnd(.18,.36),c:[[180,90,255],[255,90,200],[90,140,255],[255,170,90]][i%4],a:rnd(.18,.34),vx:rnd(-.01,.01),vy:rnd(-.008,.008),ph:rnd(0,6)});
      for(let i=0;i<260;i++)st.stars.push({x:Math.random(),y:Math.random(),sz:rnd(.3,1.1),a:rnd(.3,1),tw:rnd(0,6),c:Math.random()<.5?[255,255,255]:[200,180,255]});
      for(let i=0;i<5;i++)st.spikes.push({x:rnd(.18,.82),y:rnd(.18,.82),s:rnd(.05,.12),tw:rnd(0,6),c:i%2?[255,220,240]:[220,230,255]});
    }else{
      for(let i=0;i<700;i++){const r=rnd(.13,.42);st.stars.push({r,th:rnd(0,Math.PI*2),sz:rnd(.5,1.5),c:r<.2?[255,250,220]:r<.3?[255,200,90]:[255,120,40],a:rnd(.4,1)})}
      for(let i=0;i<120;i++)st.clouds.push({y:rnd(0,1),side:i%2?1:-1,off:rnd(-.02,.02),sp:rnd(.2,.6),sz:rnd(.6,1.6)});
      for(let i=0;i<120;i++)st.spikes.push({x:Math.random(),y:Math.random(),sz:rnd(.3,.9),a:rnd(.2,.8)});
    }
    return st;
  }
  function spike(cx,x,y,s,c,a){
    cx.save();cx.translate(x,y);cx.globalAlpha=a;
    const g=cx.createRadialGradient(0,0,0,0,0,s*.35);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(1,`rgba(${c},0)`);cx.fillStyle=g;cx.beginPath();cx.arc(0,0,s*.35,0,7);cx.fill();
    cx.strokeStyle=`rgba(${c},.85)`;cx.lineCap='round';
    for(let k=0;k<6;k++){const an=k*Math.PI/3+Math.PI/2;const L=s*(k%3===0?1:.8);const gr=cx.createLinearGradient(0,0,Math.cos(an)*L,Math.sin(an)*L);gr.addColorStop(0,`rgba(${c},.95)`);gr.addColorStop(1,`rgba(${c},0)`);cx.strokeStyle=gr;cx.lineWidth=Math.max(.6,s*.05);cx.beginPath();cx.moveTo(0,0);cx.lineTo(Math.cos(an)*L,Math.sin(an)*L);cx.stroke()}

  }
  function draw(e,t){

      for(const p of st.stars){const th=p.th+rot/Math.sqrt(p.r+.05);const x=C+Math.cos(th)*p.r*S,y=C+Math.sin(th)*p.r*S*.62;

      const halo=cx.createRadialGradient(C,C,S*.05,C,C,S*.48);halo.addColorStop(0,'rgba(95,211,138,.18)');halo.addColorStop(1,'rgba(95,211,138,0)');cx.fillStyle=halo;cx.fillRect(0,0,S,S);
    }else if(st.type==='arcanist'){
      for(const c of st.clouds){const x=(c.x+Math.sin(t*.00025*sp+c.ph)*.04)*S,y=(c.y+Math.cos(t*.0002*sp+c.ph)*.03)*S;
        const g=cx.createRadialGradient(x,y,0,x,y,c.r*S);g.addColorStop(0,`rgba(${c.c},${c.a})`);g.addColorStop(1,`rgba(${c.c},0)`);cx.fillStyle=g;cx.beginPath();cx.arc(x,y,c.r*S,0,7);cx.fill()}

      for(const k of st.spikes){spike(cx,k.x*S,k.y*S,k.s*S*(.85+.15*Math.sin(t*.0018*sp+k.tw)),k.c,.95)}
    }else{
      for(const p of st.spikes){cx.fillStyle=`rgba(255,235,200,${p.a*.6})`;cx.fillRect(p.x*S,p.y*S,p.sz*S/140,p.sz*S/140)}

      for(const j of st.clouds){const y=((j.y+t*.00012*j.sp*sp)%1);const yy=C+j.side*y*S*.5;const w=(1-y)*S*.02*j.sz+1;
        cx.fillStyle=`rgba(170,210,255,${(1-y)*.35})`;cx.beginPath();cx.arc(C+j.off*S*(1+y*2),yy,w,0,7);cx.fill()}
      const glow=cx.createRadialGradient(C,C,S*.08,C,C,S*.45);glow.addColorStop(0,'rgba(255,200,90,.5)');glow.addColorStop(.4,'rgba(255,120,40,.15)');glow.addColorStop(1,'rgba(255,120,40,0)');cx.fillStyle=glow;cx.fillRect(0,0,S,S);
      const tilt=.32;

        const front=Math.sin(th)>0;const dop=1+.6*Math.cos(th); // doppler-ish brightening on the approaching side
        cx.fillStyle=`rgba(${p.c},${Math.min(1,p.a*dop*(front?1:.55))})`;cx.fillRect(x,y,p.sz*S/110,p.sz*S/110)}

      cx.fillStyle='#000';cx.beginPath();cx.arc(C,C,S*.085,0,7);cx.fill();
      cx.globalCompositeOperation='lighter';
      cx.strokeStyle='rgba(255,230,170,.9)';cx.lineWidth=S*.012;cx.beginPath();cx.arc(C,C,S*.095,0,7);cx.stroke();
      cx.strokeStyle='rgba(255,170,60,.35)';cx.lineWidth=S*.03;cx.beginPath();cx.ellipse(C,C-S*.02,S*.16,S*.1,0,Math.PI,2*Math.PI);cx.stroke();
    }

  function loop(t){raf=0;for(const e of live){if(!e.cv.isConnected){live.delete(e);continue}draw(e,t-t0)}if(live.size)raf=requestAnimationFrame(loop)}

    root.querySelectorAll('canvas.cosmos:not([data-on])').forEach(cv=>{

function emblem(id,size){

  const runes=['ᚠ','ᚱ','ᛟ','ᛉ'].map((g,k)=>`<text x="50" y="7.4" text-anchor="middle" font-size="5" fill="#f3d27a" transform="rotate(${k*90+45} 50 50)">${g}</text>`).join('');

}

  const o=document.createElement('div');o.className='orb';o.style.setProperty('--pc',color);o.style.left=(from.x-13)+'px';o.style.top=(from.y-13)+'px';fx.appendChild(o);

/* ---- opening: start the score instantly where the browser allows; otherwise a tap-to-enter title card ---- */
let entered=false;
function grandEntrance(){
  if(entered)return;entered=true;
  AudioEngine.init();AudioEngine.play(current==='title'?'title':'map',{restart:true,atTheme:true,fast:true});
  sfx.impact();setTimeout(()=>sfx.reveal(),250);flash();
  const g=document.getElementById('gate');if(g){g.classList.add('out');setTimeout(()=>g.remove(),900)}
}
function openingGate(){
  AudioEngine.init();
  setTimeout(()=>{
    if(entered)return;
    if(AudioEngine.running()){grandEntrance();return}
    const g=document.createElement('div');g.id='gate';g.className='gate';g.setAttribute('role','button');g.tabIndex=0;g.setAttribute('aria-label','Tap to enter the game with sound');
    g.innerHTML=`<div class="gate-inner"><div class="eyebrow">TEAS 7 Science Bootcamp</div><div class="logo gate-logo">Realms of<br>Anatomica</div>
      <div class="credit">By Dr. Joannes Paulus Tolentino Hernandez</div><div class="gate-cta">Tap to enter the Realms</div><div class="note">Sound on · best with headphones</div></div>`;
    document.body.appendChild(g);
    const go=()=>grandEntrance();
    g.addEventListener('pointerdown',go);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}});
    if(!isTouch)g.focus({preventScroll:true});
  },350);
}
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{if(!entered)grandEntrance()},{once:true,capture:true}));

/* =========================================================
   MAP
   ========================================================= */
function renderMap(){
  checkExpiry();
  current='map';setRealmColor('#e9b949');Scene.set('stars');AudioEngine.play('map');AudioEngine.setRate(1);hud();
  const allDone=REALMS.every(done);
  app.innerHTML=`<section>
    <div class="map-head">
      <div><div class="eyebrow">World map · 2 days × 4 one-hour modules</div><h2>The Eight Realms</h2></div>
      <div class="progress" aria-label="Modules finished">${REALMS.map(r=>`<i class="${done(r)?'done':''}"></i>`).join('')}</div>
    </div>
    ${S.paused?(()=>{const P=S.paused,r=REALMS[P.i];return `<div class="panel pausebar"><div><div class="eyebrow">Saved battle · resume by ${new Date(P.savedAt+DAY).toLocaleString([], {weekday:'short',hour:'numeric',minute:'2-digit'})}</div><strong>Hour ${r.hour}: ${esc(r.name)}</strong> <span class="note">${P.b.correct}/${P.b.answered} correct · ${P.b.pts.toLocaleString()} pts · ${P.b.hearts} hearts left</span></div><button class="btn" id="resumeBtn">Resume battle</button></div>`})():''}
    ${[1,2].map(day=>{const list=REALMS.map((r,i)=>[r,i]).filter(([r])=>dayOf(r)===day);const fin=list.filter(([r])=>done(r)).length;
    return `<div class="dayhead"><h3>Day ${day}</h3><span class="eyebrow">Hours ${day===1?'1 to 4':'5 to 8'} · ${fin}/4 modules finished</span></div>
    <div class="realms">${list.map(([r,i])=>{
      const x=rec(r.id),lock=!unlocked(i),n=x.attempts.length;
      const st=done(r)?'final':lock?'locked':n>=MAX_ATTEMPTS?'choose':'ready';
      const label={final:'Final locked',locked:'Locked',choose:'Choose final',ready:n?`${MAX_ATTEMPTS-n} attempt${MAX_ATTEMPTS-n===1?'':'s'} left`:'Ready'}[st];
      const f=finalOf(r);
      return `<button class="realm" style="--c:${r.c}" data-i="${i}" ${lock?'disabled aria-disabled="true"':''}>
        <span class="hr">HOUR ${r.hour}</span>
        <h3>${esc(r.name)}</h3>
        <span class="topic">${esc(r.topic)} · ${r.q.length} questions</span>
        <span class="boss" aria-hidden="true">${lock?'🔒':r.sprite}</span>
        <span class="foot"><span class="status ${st}">${label}</span>
          <span class="pips" title="Attempts">${[0,1,2].map(k=>`<i class="${x.final===k?'final':k<n?'used':''}"></i>`).join('')}</span>
          ${f?`<span class="pct">Final ${f.pct}% · report ready</span>`:n?`<span class="pct">Avg ${realmAvg(r)}%</span>`:''}</span>
      </button>`}).join('')}</div>`}).join('')}
    ${allDone?`<div class="hall-cta"><button class="btn" id="hallBtn">Open your final report</button></div>`:
      `<p class="note" style="margin-top:16px">The next realm opens once you lock in a final attempt for the one before it. Day 2 opens after Hour 4.</p>`}
    <div class="review" style="max-width:none;margin-top:16px">${downloadsSectionHTML()}</div>
    <div class="row" style="justify-content:flex-start;margin-top:8px"><button class="iconbtn" id="titleBtn">Back to landing page</button></div>
  </section>`;
  wireDownloads(app);
  app.querySelectorAll('.realm:not([disabled])').forEach(b=>b.onclick=()=>{sfx.click();openRealm(+b.dataset.i)});
  const rb=$('#resumeBtn');if(rb)rb.onclick=()=>{AudioEngine.init();sfx.reveal();startBattle(S.paused.i,true)};
  if(allDone)$('#hallBtn').onclick=()=>{sfx.win();renderReport()};
  $('#titleBtn').onclick=renderTitle;
}

const pausedIn=r=>!!(S.paused&&S.paused.rid===r.id);
const isPausedAtt=(r,k)=>pausedIn(r)&&S.paused.attemptIdx===k;
function attemptRows(r,opts={}){
  const x=rec(r.id);
  return `<div class="attempts">${x.attempts.map((a,k)=>`
    <div class="att ${x.final===k?'is-final':''}">

      <div><span class="s">${a.pct}%</span> <span class="d">${a.correct}/${a.answered} correct · ${isPausedAtt(r,k)?'paused (resume within 24 h)':a.won?'boss defeated':a.expired?'closed after 24 h':a.abandoned?'left early':'boss survived'} · ${a.pts.toLocaleString()} pts</span></div>
      <div class="row">${x.final===k?'<span class="status final">Final</span>':opts.choose&&x.final===null&&!pausedIn(r)?`<button class="btn small" data-final="${k}">Make final</button>`:''}</div>
    </div>`).join('')}</div>
    ${x.attempts.length?`<div class="avg"><span>Average of attempts: <b>${realmAvg(r)}%</b></span>${finalOf(r)?`<span>Final: <b>${finalOf(r).pct}%</b></span>`:''}</div>`:''}`;
}
function wireFinalButtons(root,r,after){
  root.querySelectorAll('[data-final]').forEach(b=>{
    b.onclick=()=>{

      const x=rec(r.id);x.final=+b.dataset.final;x.finalAt=isoSec(Date.now());save();const was=!!S.completedAt;stampCompletion();sendFinal(r,!was&&!!S.completedAt);sfx.reveal();banner(`Final score locked: ${x.attempts[x.final].pct}%`,r.c);hud();after();
    };
  });
}

function openRealm(i){

async function intro(i){
  const r=REALMS[i];setRealmColor(r.c);Scene.set(r.scene);AudioEngine.play(r.song);current='intro';
  const c=document.createElement('div');c.className='cine';
  c.innerHTML=`<div class="lbox top"></div><div class="lbox bot"></div>
    <div class="inner">
      <div class="hourtag">DAY ${dayOf(r)} · HOUR ${r.hour} · ${esc(r.topic.toUpperCase())}</div>

      <button class="btn go" id="fight">Fight!</button>
    </div>
    <button class="iconbtn skip" id="skip">Skip</button>`;
  document.body.appendChild(c);
  let skipped=false;
  const finish=()=>{if(c.isConnected){c.remove();startBattle(i)}};
  c.querySelector('#skip').onclick=()=>{skipped=true;finish()};
  c.querySelector('#fight').onclick=()=>{sfx.click();finish()};
  const w=ms=>skipped?Promise.resolve():sleep(reduced?Math.min(ms,80):ms);
  await w(30);c.classList.add('on');sfx.whoosh();sfx.warp();
  await w(500);if(skipped)return;c.querySelector('.hourtag').classList.add('show');
  const nm=c.querySelector('.rname');
  for(const ch of r.name){if(skipped)return;nm.textContent+=ch;if(ch!==' ')sfx.typer();await w(45)}
  await w(250);c.querySelector('.lore').classList.add('show');
  await w(1300);if(skipped)return;
  // boss reveal
  sfx.riser();await w(900);if(skipped)return;const b=c.querySelector('.bossreveal');b.classList.add('up');sfx.roar();
  await w(800);if(skipped)return;flash();sfx.impact();if(r.scene==='embers')sfx.dragon();else sfx.thunder();b.classList.add('lit');c.querySelector('.bname').classList.add('show');
  await w(600);c.querySelector('.quote').classList.add('show');sfx.taunt();
  await w(500);const g=c.querySelector('#fight');g.classList.add('show');if(!isTouch)g.focus({preventScroll:true});
}

let B=null,timerId=null;
function startBattle(i,resume){
  const r=REALMS[i],x=rec(r.id);
  const P=resume&&S.paused&&S.paused.rid===r.id?S.paused:null;
  const practice=!P&&done(r);
  let attemptIdx=null;
  if(P)attemptIdx=P.attemptIdx;
  else if(!practice){
    // record the attempt immediately so leaving mid-battle still uses it
    x.attempts.push({pct:0,pts:0,correct:0,answered:0,won:false,abandoned:true,missed:[],date:new Date().toISOString()});
    attemptIdx=x.attempts.length-1;
  }
  B={i,r,practice,attemptIdx,deck:shuffle(r.q.map((q,k)=>k)),idx:-1,boss:BOSS_HP,hearts:HEARTS,combo:0,maxCombo:0,pts:0,correct:0,answered:0,missed:[],locked:true,
     chestAt:1+Math.floor(Math.random()*3),chestLive:false,enraged:false,buffs:{oracle:false,hourglass:false},log:[]};
  if(P){Object.assign(B,JSON.parse(JSON.stringify(P.b)));B.idx=P.b.resumeIdx;B.locked=true;delete B.resumeIdx}
  B.t0=practice?0:Date.now();
  persistPause();
  current='battle';setRealmColor(r.c);Scene.set(r.scene);AudioEngine.play(r.song);AudioEngine.setRate(1);hud();
  const cl=heroClass();
  app.innerHTML=`<section class="arena">
    <div class="stage" id="stage">
      <div class="stage-top">
        <div><div class="eyebrow">Hour ${r.hour} · ${esc(r.name)} · ${practice?'practice run':`attempt ${attemptIdx+1} of 3`}</div>
        <div class="bossname">${esc(r.boss)}</div>
        <div class="bar" role="meter" aria-label="Boss health" aria-valuemin="0" aria-valuemax="${BOSS_HP}" aria-valuenow="${BOSS_HP}" id="bossBar"><i style="width:100%"></i></div></div>
        <div style="display:grid;gap:6px;justify-items:end">${practice?'':'<button class="iconbtn" id="saveExit">Save &amp; exit</button>'}<div class="combo" id="combo"></div><div class="buffs" id="buffs"></div></div>
      </div>
      <div class="sprite-zone"><div class="taunt" id="taunt"></div><div class="sprite" id="sprite" aria-hidden="true">${r.sprite}</div></div>
      <div class="player">
        <div class="hero" id="heroTag" style="--c:${cl.c}">${emblem(cl.id,44)}<div><strong>${esc(S.hero)}</strong><div class="note">${cl.name}</div></div></div>
        <div class="hearts" id="hearts" aria-label="Hearts"></div>
        <span class="chip">Points <b id="pts">0</b></span>
      </div>
    </div>
    <div class="timer" aria-hidden="true"><i id="timeFill"></i></div>
    <div class="panel qcard" id="qcard"></div>
  </section>`;
  Cosmos.mount(app);
  drawHearts();drawBuffs();
  $('#bossBar').firstElementChild.style.width=(B.boss/BOSS_HP*100)+'%';$('#pts').textContent=B.pts.toLocaleString();
  if(B.enraged){$('#stage').classList.add('enraged');AudioEngine.setRate(1.15)}
  const se=$('#saveExit');if(se)se.onclick=saveAndExit;
  if(P){banner('Battle resumed!','#e9b949');setTimeout(()=>say('So... you came back.'),600)}else setTimeout(()=>say(pick(r.taunts)),400);
  nextQ();
}
function persistPause(){
  if(!B||B.practice)return;
  const b={deck:B.deck,resumeIdx:B.locked?B.idx:B.idx-1,boss:B.boss,hearts:B.hearts,combo:B.combo,maxCombo:B.maxCombo,pts:B.pts,correct:B.correct,answered:B.answered,
    missed:B.missed.slice(),log:(B.log||[]).slice(),chestAt:B.chestAt,enraged:B.enraged,buffs:Object.assign({},B.buffs)};
  S.paused={rid:B.r.id,i:B.i,attemptIdx:B.attemptIdx,savedAt:Date.now(),b};save();
}
function saveAndExit(){
  if(!B||B.practice)return;
  clearInterval(timerId);activeTick(true);{const a=rec(B.r.id).attempts[B.attemptIdx];if(a)a.pauses=(a.pauses||0)+1}persistPause();B.locked=true;current='saved';AudioEngine.setRate(1);sfx.reveal();
  const until=new Date(S.paused.savedAt+DAY);
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="panel modal" role="dialog" aria-modal="true" aria-labelledby="svt">
    <h2 id="svt" style="color:var(--gold)">Progress saved</h2>
    <p style="margin:0">You have answered ${B.answered} question${B.answered===1?'':'s'} (${B.correct} correct) and earned ${B.pts.toLocaleString()} points. The boss has ${B.boss} of ${BOSS_HP} HP left.</p>
    <p style="margin:0">Resume this battle before <strong>${until.toLocaleString([], {weekday:'long',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</strong>. After 24 hours the attempt closes with the score you have now.</p>
    <div class="row"><button class="btn ghost" id="svLanding">Landing page</button><button class="btn" id="svMap">World map</button></div></div>`;
  document.body.appendChild(bg);
  $('#svMap').onclick=()=>{bg.remove();renderMap()};
  $('#svLanding').onclick=()=>{bg.remove();renderTitle()};
}
function checkExpiry(){
  const P=S.paused;if(!P)return false;
  if(Date.now()-P.savedAt>DAY){const x=rec(P.rid);const a=x.attempts[P.attemptIdx];if(a){a.abandoned=false;a.expired=true;a.won=false;a.doneAt=isoSec(P.savedAt+DAY)}S.paused=null;save();if(a)sendAttempt(REALMS.find(z=>z.id===P.rid),P.attemptIdx,'Module attempt (closed after 24 hours)');
    toast('A saved battle was not resumed within 24 hours. It now counts with the score you had.');return true}
  return false;
}
function toast(msg){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),5200)}
function drawHearts(){const h=$('#hearts');if(!h)return;h.innerHTML=Array.from({length:HEARTS},(_,k)=>`<span class="${k<B.hearts?'':'lost'}">❤️</span>`).join('');h.setAttribute('aria-label',`${B.hearts} of ${HEARTS} hearts`)}
function drawBuffs(){const b=$('#buffs');if(!b)return;b.innerHTML=(B.buffs.oracle?'<span class="buff">Oracle\'s Eye ready</span>':'')+(B.buffs.hourglass?'<span class="buff">Hourglass ready</span>':'')}
let tauntT=0;
function say(text){const t=$('#taunt');if(!t)return;t.textContent=text;t.classList.add('show');sfx.taunt();clearTimeout(tauntT);tauntT=setTimeout(()=>t.classList.remove('show'),2400)}
function typeLabel(t){return {mc:'Multiple choice',tf:'True or false',ord:'Ordered response',mat:'Matching',fill:'Fill in the blank',hot:'Hot spot'}[t]}
const Q_SECONDS=90; // every question: 1.5 minutes
function limitFor(t){return Q_SECONDS}

function nextQ(){
  B.idx++;B.locked=false;
  if(B.idx>=B.deck.length)B.deck=B.deck.concat(shuffle(B.r.q.map((q,k)=>k)));
  B.qi=B.deck[B.idx];const q=B.r.q[B.qi];B.q=q;
  const card=$('#qcard');
  if(B.idx===B.chestAt){
    B.chestLive=true;sfx.chest();
    card.innerHTML=`<div class="chest"><div class="box" aria-hidden="true">🎁</div><strong>A mystery chest appears!</strong><span class="note">Answer the next question correctly to unlock it. Get it wrong and it vanishes in smoke.</span><button class="btn" id="openQ">Reveal the question</button></div>`;
    const b=$('#openQ');if(!isTouch)b.focus({preventScroll:true});b.onclick=()=>{sfx.whoosh();showQuestion()};
    $('#timeFill').style.width='100%';
    return;
  }
  showQuestion();
}
function showQuestion(){
  const q=B.q,card=$('#qcard');let body='';
  if(q.t==='mc'){
    B.opts=shuffle(q.o.map((o,k)=>({o,ok:k===q.a})));
    body=`<div class="opts">${B.opts.map((x,k)=>`<button class="opt" data-k="${k}"><kbd>${k+1}</kbd><span>${esc(x.o)}</span></button>`).join('')}</div>`;
  }else if(q.t==='tf'){
    body=`<div class="opts tf"><button class="opt" data-v="true">True</button><button class="opt" data-v="false">False</button></div>`;
  }else if(q.t==='ord'){
    B.seq=[];B.pool=shuffle(q.items.map((s,k)=>({s,k})));
    body=`<div class="seq" id="seq"></div><div class="pool" id="pool">${B.pool.map((x,k)=>`<button class="rune" data-p="${k}">${esc(x.s)}</button>`).join('')}</div>
      <div class="castbar"><button class="iconbtn" id="clr">Clear</button><button class="btn" id="cast" disabled>Cast</button></div>`;
  }else if(q.t==='mat'){
    B.left=q.pairs.map((p,k)=>({s:p[0],k}));B.right=shuffle(q.pairs.map((p,k)=>({s:p[1],k})));B.pairs={};B.sel=0;
    body=`<p class="note" style="margin:0">Tap an item on the left, then its match on the right.</p><div class="match"><div class="col">${B.left.map((x,k)=>`<button class="mitem" data-l="${k}">${esc(x.s)}</button>`).join('')}</div>
      <div class="col">${B.right.map((x,k)=>`<button class="mitem" data-r="${k}">${esc(x.s)}</button>`).join('')}</div></div>
      <div class="castbar"><button class="iconbtn" id="clr">Clear</button><button class="btn" id="cast" disabled>Cast</button></div>`;
  }else if(q.t==='fill'){
    body=`<form class="fillrow" id="fillF"><label for="fillIn" class="note" style="flex-basis:100%">Type your answer</label><input type="text" id="fillIn" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn" type="submit">Cast</button></form>`;
  }else if(q.t==='hot'){
    body=`<div class="hotwrap">${HOTMAPS[q.map]()}</div>`;
  }
  card.innerHTML=`<div class="qinner ${reduced?'':'flip'}"><div class="qmeta"><span class="qtype">${B.chestLive?'Mystery chest · ':''}${typeLabel(q.t)}</span><span class="note">Question ${B.answered+1}</span></div>
    <div class="qtext">${esc(q.q)}</div>${body}<div id="fb"></div></div>`;
  wire(q);
  let lim=limitFor(q.t);
  if(B.buffs.hourglass){lim*=2;B.buffs.hourglass=false;banner('Hourglass: double time!','#6fe0d6');drawBuffs()}
  if(B.buffs.oracle&&q.t==='mc'){B.buffs.oracle=false;drawBuffs();setTimeout(()=>{let n=0;card.querySelectorAll('.opt').forEach((o,k)=>{if(n<2&&!B.opts[k].ok){o.classList.add('banished');o.disabled=true;n++}});banner("Oracle's Eye: two wrong answers banished",'#b48cff');sfx.reveal()},400)}
  startTimer(lim);
  const first=card.querySelector('.opt:not(:disabled),.rune,.mitem,#fillIn,.hs');if(first&&!isTouch)first.focus({preventScroll:true});
}

function wire(q){
  const card=$('#qcard');
  if(q.t==='mc'){
    card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(B.locked)return;const x=B.opts[+b.dataset.k];
      card.querySelectorAll('.opt').forEach((o,k)=>{o.disabled=true;if(B.opts[k].ok)o.classList.add('right')});
      if(!x.ok)b.classList.add('wrong');resolve(x.ok);
    });
  }else if(q.t==='tf'){
    card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(B.locked)return;const v=b.dataset.v==='true';
      card.querySelectorAll('.opt').forEach(o=>{o.disabled=true;if((o.dataset.v==='true')===q.a)o.classList.add('right')});
      if(v!==q.a)b.classList.add('wrong');resolve(v===q.a);
    });
  }else if(q.t==='ord'){
    const seqEl=$('#seq'),cast=$('#cast');
    const redraw=()=>{
      seqEl.innerHTML=B.seq.map((p,n)=>`<button class="rune placed" data-n="${n+1}" data-s="${n}">${esc(B.pool[p].s)}</button>`).join('');
      card.querySelectorAll('#pool .rune').forEach(b=>b.disabled=B.seq.includes(+b.dataset.p));
      seqEl.querySelectorAll('.rune').forEach(b=>b.onclick=()=>{if(B.locked)return;B.seq.splice(+b.dataset.s,1);sfx.click();redraw()});
      cast.disabled=B.seq.length!==B.pool.length;
    };
    card.querySelectorAll('#pool .rune').forEach(b=>b.onclick=()=>{if(B.locked)return;B.seq.push(+b.dataset.p);sfx.click();redraw()});
    $('#clr').onclick=()=>{if(B.locked)return;B.seq=[];redraw()};
    cast.onclick=()=>{if(B.locked)return;const ok=B.seq.every((p,n)=>B.pool[p].k===n);
      card.querySelectorAll('.rune,#clr').forEach(b=>b.disabled=true);cast.disabled=true;resolve(ok)};
  }else if(q.t==='mat'){
    const colors=['#6fe0d6','#e9b949','#ff8fb1','#9db4ff','#b6f09c'];const cast=$('#cast');
    const redraw=()=>{
      card.querySelectorAll('[data-l]').forEach(b=>{const k=+b.dataset.l;b.classList.toggle('sel',B.sel===k);
        if(B.pairs[k]!==undefined){b.classList.add('paired');b.style.setProperty('--pc',colors[k]);b.innerHTML=`<span class="tag">${k+1}</span>${esc(B.left[k].s)}`}else{b.classList.remove('paired');b.textContent=B.left[k].s}});
      card.querySelectorAll('[data-r]').forEach(b=>{const rk=+b.dataset.r;const lk=Object.keys(B.pairs).find(l=>B.pairs[l]===rk);
        if(lk!==undefined){b.classList.add('paired');b.style.setProperty('--pc',colors[lk]);b.innerHTML=`<span class="tag">${+lk+1}</span>${esc(B.right[rk].s)}`}else{b.classList.remove('paired');b.textContent=B.right[rk].s}});
      cast.disabled=Object.keys(B.pairs).length!==B.left.length;
    };
    card.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{if(B.locked)return;const k=+b.dataset.l;if(B.pairs[k]!==undefined)delete B.pairs[k];B.sel=k;sfx.click();redraw()});
    card.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{if(B.locked||B.sel===null)return;const rk=+b.dataset.r;
      for(const l in B.pairs)if(B.pairs[l]===rk)delete B.pairs[l];B.pairs[B.sel]=rk;
      const nx=B.left.findIndex((_,k)=>B.pairs[k]===undefined);B.sel=nx<0?null:nx;sfx.click();redraw()});
    $('#clr').onclick=()=>{if(B.locked)return;B.pairs={};B.sel=0;redraw()};
    redraw();
    cast.onclick=()=>{if(B.locked)return;const ok=B.left.every((_,k)=>B.right[B.pairs[k]].k===k);
      card.querySelectorAll('.mitem,#clr').forEach(b=>b.disabled=true);cast.disabled=true;resolve(ok)};
  }else if(q.t==='fill'){
    $('#fillF').onsubmit=e=>{e.preventDefault();if(B.locked)return;const v=$('#fillIn').value;if(!v.trim())return;
      const norm=s=>s.toLowerCase().replace(/[\s.,]/g,'');const ok=q.a.some(a=>norm(a)===norm(v));$('#fillIn').disabled=true;resolve(ok)};
  }else if(q.t==='hot'){
    card.querySelectorAll('.hs').forEach(g=>{
      const go=()=>{if(B.locked)return;const ok=g.dataset.id===q.a;card.querySelectorAll('.hs').forEach(h=>{if(h.dataset.id===q.a)h.classList.add('right')});if(!ok)g.classList.add('wrong');resolve(ok)};
      g.addEventListener('click',go);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}});
    });
  }
}

function startTimer(sec){
  clearInterval(timerId);const fill=$('#timeFill');const t0=performance.now();B.limit=sec;let warned=false;
  const tick=()=>{if(!B||B.locked)return;const left=Math.max(0,sec-(performance.now()-t0)/1000);B.timeLeft=left;
    if(fill){fill.style.width=(left/sec*100)+'%';fill.classList.toggle('low',left<10)}
    if(left<10&&!warned){warned=true;sfx.heart()}
    if(left<=0){clearInterval(timerId);timeout()}};
  B.timeLeft=sec;tick();timerId=setInterval(tick,100);
}
function timeout(){
  if(B.locked)return;const card=$('#qcard');
  card.querySelectorAll('button,input').forEach(b=>b.disabled=true);
  if(B.q.t==='hot')card.querySelectorAll('.hs').forEach(h=>{if(h.dataset.id===B.q.a)h.classList.add('right')});
  resolve(false,true);
}

const REWARDS=[
  {id:'heal',name:'Phoenix Feather',text:'+1 heart restored (or +250 points if your hearts are full).'},
  {id:'gold',name:'Dragon Gold',text:'+300 bonus points.'},
  {id:'hourglass',name:'Sands of Time',text:'Your next question gets double time.'},
  {id:'oracle',name:"Oracle's Eye",text:'Two wrong answers vanish on your next multiple-choice question.'}
];
function applyReward(){
  const rw=pick(REWARDS);
  if(rw.id==='heal'){if(B.hearts<HEARTS){B.hearts++;drawHearts()}else B.pts+=250}

const pdfSafe=s=>String(s).replace(/→/g,'->').replace(/[₂]/g,'2').replace(/×/g,'x').replace(/[—–]/g,'-').replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/[^\x20-\x7E\xA0-\xFF\n]/g,'');
/* =========================================================
   REPORT VERIFICATION
   Code = SHA-256(secret | V1 | name | correct | total | attempt | completedAt)
   rendered as ANATOMICA-XXXXX-XXXXX. Changing any value changes the code.
   Not a cryptographic guarantee: the secret ships inside this page.
   ========================================================= */
const VSECRET='rOA-v1-7f3c9e2a41b84d0f9a6e5c1d2b3a4f60-TEAS7-JPTH';
const B32='0123456789ABCDEFGHJKMNPQRSTVWXYZ';
const canonName=s=>pdfSafe(String(s||'')).normalize('NFC').replace(/\s+/g,' ').trim();
async function reportCode(name,correct,total,attempt,completedAt,hour){
  const parts=[VSECRET,'V1',canonName(name)];if(hour)parts.push('H'+(hour|0));
  const msg=parts.concat([String(correct|0),String(total|0),String(attempt|0),completedAt]).join('|');
  const h=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(msg)));
  let bits=0,acc=0,out='';
  for(const b of h){acc=(acc<<8)|b;bits+=8;while(bits>=5&&out.length<10){out+=B32[(acc>>(bits-5))&31];bits-=5}if(out.length>=10)break;acc&=(1<<bits)-1}
  return 'ANATOMICA-'+out.slice(0,5)+'-'+out.slice(5,10);
}
const isoSec=d=>new Date(d).toISOString().replace(/\.\d{3}Z$/,'Z');
/* Stamp the completion moment once, when the 8th final is locked; it never changes after. */
function stampCompletion(){
  if(S.completedAt||!REALMS.every(done))return;
  let runs=0;try{runs=+localStorage.getItem(KEY+'.runs')||0}catch(e){}
  S.completedAt=isoSec(Date.now());S.attemptNo=runs+1;
  try{localStorage.setItem(KEY+'.runs',String(runs+1))}catch(e){}
  save();
}
function reportFacts(){
  let correct=0,total=0;REALMS.forEach(r=>{const f=finalOf(r);if(f){correct+=f.correct|0;total+=f.answered|0}});
  return {name:canonName(S.hero),correct,total,pct:total?Math.round(correct/total*100):0,attempt:S.attemptNo||1,completedAt:S.completedAt||isoSec(Date.now())};
}
async function verificationLine(){
  const f=reportFacts();const code=await reportCode(f.name,f.correct,f.total,f.attempt,f.completedAt);
  return {f,code,line:`V1 | ${f.name} | Score ${f.correct}/${f.total} | Attempt ${f.attempt} | Completed ${f.completedAt} | Code ${code}`};
}
/* Forgiving parser: copy-paste from PDFs adds line breaks, odd spaces, ligatures, smart punctuation. */
function parseVerificationLine(raw){
  let t=String(raw||'').normalize('NFKC')
    .replace(/[​-‍﻿­]/g,'')
    .replace(/[‐-―−]/g,'-')
    .replace(/[¦│┃｜ǀ∣]/g,'|')
    .replace(/\s+/g,' ').trim();
  let hour=0;const hm=t.match(/\|\s*H\s*o\s*u\s*r\s*:?\s*(\d+)\s*(?=\|)/i);if(hm){hour=parseInt(hm[1],10);t=t.replace(hm[0],'')}
  const m=t.match(/V\s*1\s*\|\s*(.+?)\s*\|\s*S\s*c\s*o\s*r\s*e\s*:?\s*(\d[\d\s]*)\s*\/\s*(\d[\d\s]*)\s*\|\s*A\s*t\s*t\s*e\s*m\s*p\s*t\s*:?\s*(\d[\d\s]*)\s*\|\s*C\s*o\s*m\s*p\s*l\s*e\s*t\s*e\s*d\s*:?\s*([0-9][0-9TZ:\-\s]*?)\s*\|\s*C\s*o\s*d\s*e\s*:?\s*([A-Za-z0-9\-\s]+)/i);
  if(!m)return null;
  const num=x=>parseInt(x.replace(/\s/g,''),10);
  let when=m[5].replace(/\s/g,'').toUpperCase();
  const code=m[6].toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/^(ANATOMICA|GAME)/,'');
  if(code.length<10)return null;
  return {name:canonName(m[1]),hour,correct:num(m[2]),total:num(m[3]),attempt:num(m[4]),completedAt:when,code:'ANATOMICA-'+code.slice(0,5)+'-'+code.slice(5,10)};
}
async function verifyLine(raw){
  const p=parseVerificationLine(raw);
  if(!p)return {ok:false,reason:'format'};
  const expect=await reportCode(p.name,p.correct,p.total,p.attempt,p.completedAt,p.hour);
  return {ok:expect===p.code,p};
}

const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC_T[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zipStore(files){ // files: [{name, data:Uint8Array}] -> Uint8Array (no compression)
  const enc=new TextEncoder();const parts=[],cent=[];let off=0;
  files.forEach(f=>{const nm=enc.encode(f.name),d=f.data,crc=crc32(d);
    const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,0,true);h.setUint16(12,0x21,true);
    h.setUint32(14,crc,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),nm,d);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,0,true);c.setUint16(14,0x21,true);
    c.setUint32(16,crc,true);c.setUint32(20,d.length,true);c.setUint32(24,d.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
    cent.push(new Uint8Array(c.buffer),nm);off+=30+nm.length+d.length});
  const cdSize=cent.reduce((s,a)=>s+a.length,0);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cdSize,true);e.setUint32(16,off,true);
  const all=[...parts,...cent,new Uint8Array(e.buffer)];const out=new Uint8Array(all.reduce((s,a)=>s+a.length,0));let p=0;all.forEach(a=>{out.set(a,p);p+=a.length});return out;
}

async function ensureJsPDF(){

  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){dl=null}

/* ---- Can't download? Transfer results to the course copy of the game ----
   Some viewers cannot download from this page (for example "Downloads from this artifact are only
   available to members of its organization"). Results live in this browser, so the student copies
   a transfer code here and imports it into the course copy, where downloads work. The code carries a
   checksum, so a partial or edited code is refused. */
/* =========================================================
   FULL RESULTS CODE — ANATOMICA-TRANSFER-1.<data>.<check>
   <data> = "z" + base64url(gzip(JSON)) when the browser can gzip, else "j" + base64url(JSON).
   <check> = 16 hex characters made with the page's hidden secret; a changed or partial code fails.
   The JSON holds everything needed to rebuild the complete report: all saved progress and
   answers (with timing), demographics, name and email.
   ========================================================= */
const XFER_TAG='ANATOMICA-TRANSFER-1';
const b64u=u=>b64(u).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64u=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return unb64(s)};
async function streamBytes(bytes,ts){return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(ts)).arrayBuffer())}
async function makeTransferCode(){
  let runs=0;try{runs=+localStorage.getItem(KEY+'.runs')||0}catch(e){}
  const json=te.encode(JSON.stringify({s:S,runs,at:Date.now()}));
  let data='j'+b64u(json);
  if(typeof CompressionStream==='function'){try{data='z'+b64u(await streamBytes(json,new CompressionStream('gzip')))}catch(e){}}
  const check=(await sha(VSECRET+'|xfer|'+data)).slice(0,16);
  return `${XFER_TAG}.${data}.${check}`;
}
async function readTransferCode(raw){
  const t=String(raw||'').normalize('NFKC').replace(/[\s​-‍﻿­]+/g,'');
  const BAD='The code was changed or is incomplete. Copy it again all the way to the end, then paste everything.';
  let data=null,json=null;
  const m=t.match(/ANATOMICA-TRANSFER-1\.([zj][A-Za-z0-9_-]+)\.([0-9a-fA-F]{16})(?![0-9a-fA-F])/);
  if(m){data=m[1];if((await sha(VSECRET+'|xfer|'+data)).slice(0,16)!==m[2].toLowerCase())return {err:BAD};
    try{let bytes=unb64u(data.slice(1));
      if(data[0]==='z'){if(typeof DecompressionStream!=='function')return {err:'This browser is too old to open the code. Use a current version of Chrome, Edge, Safari or Firefox.'};bytes=await streamBytes(bytes,new DecompressionStream('gzip'))}
      json=td.decode(bytes)}catch(e){return {err:BAD}}}
  else{const o=t.match(/REALMS-TRANSFER-1\.([0-9a-f]{16})\.([A-Za-z0-9_-]+)/i); // codes made before October 13, 2026
    if(!o){return {err:/ANATOMICA-TRANSFER|REALMS-TRANSFER/i.test(t)?BAD:'No full results code was found. Paste the learner\'s whole submission, including the long code that starts with ANATOMICA-TRANSFER-1.'}}
    if((await sha(VSECRET+'|xfer|'+o[2])).slice(0,16)!==o[1].toLowerCase())return {err:BAD};
    try{json=td.decode(unb64u(o[2]))}catch(e){return {err:BAD}}}
  let d;try{d=JSON.parse(json)}catch(e){return {err:BAD}}
  if(!d||!d.s||d.s.v!==2||!d.s.realms||typeof d.s.hero!=='string')return {err:'The code does not contain game results.'};
  return {d};
}

/* ---- normal browser download with visible fallbacks (phones: share sheet, Open, Download) ---- */
function browserSave(blob,fname,msg,doneText){
  const url=URL.createObjectURL(blob);setTimeout(()=>URL.revokeObjectURL(url),30*60*1000);
  const mobile=isPhoneLike();
  let file=null;try{file=new File([blob],fname,{type:blob.type||'application/octet-stream'})}catch(e){}
  const canShare=!!(file&&navigator.canShare&&navigator.share&&(()=>{try{return navigator.canShare({files:[file]})}catch(e){return false}})());
  if(!mobile){const a=document.createElement('a');a.href=url;a.download=fname;a.rel='noopener';document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),1000)}
  if(!msg)return true;
  const isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.platform||''));
  msg.innerHTML=`<span class="dlbox"><strong>${esc(doneText||'Your file is ready.')}</strong>
    ${mobile?`<span class="row" style="justify-content:center">${canShare?'<button type="button" class="btn small" data-dl="share">Save to Files / Share</button>':''}
      <a class="btn small ghost" href="${url}" target="_blank" rel="noopener" data-dl="open">Open</a><a class="btn small ghost" href="${url}" download="${esc(fname)}" data-dl="get">Download</a></span>
      <span class="note">${isIOS?'<strong>iPhone or iPad:</strong> tap <strong>Save to Files</strong>, choose a folder, then <strong>Save</strong>. Or tap <strong>Open</strong>, then the Share button (square with an arrow) and <strong>Save to Files</strong>.'
        :'<strong>Android:</strong> tap <strong>Download</strong>; the file goes to Files › Downloads. Or tap <strong>Open</strong>, then the ⋮ menu and <strong>Download</strong>.'}</span>`
      :`<span class="note">Did the download not start? <a href="${url}" download="${esc(fname)}" data-dl="get">Open or save the file</a>.</span>`}</span>`;
  const sb=msg.querySelector('[data-dl="share"]');
  if(sb)sb.onclick=async()=>{try{await navigator.share({files:[file],title:fname})}catch(e){if(e&&e.name!=='AbortError')toast('Sharing did not work here. Use Open or Download instead.')}};

/* ---- outbox: one row per completed attempt, final choice, course completion or later change ---- */
function sheetEnqueue(row){
  if(!SHEET||!row)return;
  const id=row['Verification code']+'|'+row['Row type'];
  const sent=lsGet(SENT_KEY,[]),box=lsGet(OUTBOX_KEY,[]);
  if(sent.includes(id)||box.some(x=>x.id===id))return;
  box.push({id,row,tries:0});lsSet(OUTBOX_KEY,box);sheetFlush();
}
let flushing=false,flushAgain=false;
async function sheetFlush(){
  if(!SHEET)return;if(flushing){flushAgain=true;return}flushing=true;
  try{
    const tried=new Set();
    for(;;){
      const it=lsGet(OUTBOX_KEY,[]).find(x=>!tried.has(x.id));if(!it)break;tried.add(it.id);
      let ok=false;
      try{await fetch(SHEET,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({app:APP_NAME,v:1,row:it.row})});ok=true}catch(e){}
      const box=lsGet(OUTBOX_KEY,[]);const cur=box.find(x=>x.id===it.id);if(!cur)continue;
      if(ok){lsSet(OUTBOX_KEY,box.filter(x=>x.id!==it.id));const sent=lsGet(SENT_KEY,[]);sent.push(it.id);lsSet(SENT_KEY,sent.slice(-500))}
      else{cur.tries=(cur.tries||0)+1;lsSet(OUTBOX_KEY,cur.tries>=8?box.filter(x=>x.id!==it.id):box)}
    }
  }finally{flushing=false;if(flushAgain){flushAgain=false;setTimeout(sheetFlush,50)}}
}
if(SHEET){window.addEventListener('online',sheetFlush);setTimeout(sheetFlush,1500)}

/* =========================================================
   INSTRUCTOR TOOLS — no student sign-in needed.
   Everything shared (resets, instructors, class lists) is stored in this
   page itself (#adminCfg). Saving publishes a new version of the page,
   and every device picks it up the next time the game opens.
   Instructors sign in with their email and password (no PIN). Class lists
   are encrypted: each student's record opens only for someone who types
   that exact name, ID or email; the full list opens only for signed-in
   instructors, whose accounts each hold the list key under their password.
   ========================================================= */
const MAIN_ADMINS=['jphernandezrn@gmail.com','stellarlifetech@gmail.com'];
const LOOKUP_ITERS=20000, KEK_ITERS=150000;
const CFG=(()=>{let c={};try{c=JSON.parse(document.getElementById('adminCfg').textContent)||{}}catch(e){}
  return {v:3,seasonAt:+c.seasonAt||0,resets:Array.isArray(c.resets)?c.resets:[],instructors:Array.isArray(c.instructors)?c.instructors:[],
    courseUrl:typeof c.courseUrl==='string'&&/^https:\/\//.test(c.courseUrl)?c.courseUrl:'',salt:c.salt||'f6461d1219951953f21f13fb6d2a20bb',accounts:Array.isArray(c.accounts)?c.accounts:[],
    roster:c.roster||null,lookup:c.lookup&&typeof c.lookup==='object'?c.lookup:{},orgs:c.orgs&&typeof c.orgs==='object'?c.orgs:{},count:+c.count||0}})();

/* ---- crypto helpers (Web Crypto) ---- */
const te=new TextEncoder(),td=new TextDecoder();
const hexOf=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
function b64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)}
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function sha(s){return hexOf(await crypto.subtle.digest('SHA-256',te.encode(s)))}
async function pbk(secret,saltStr,iters){const k=await crypto.subtle.importKey('raw',te.encode(secret),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:te.encode(saltStr),iterations:iters,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encJ(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(JSON.stringify(obj)));return b64(iv)+'.'+b64(ct)}
async function decJ(key,str){const [a,b]=str.split('.');const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(a)},key,unb64(b));return JSON.parse(td.decode(pt))}
const normName=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const normId=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const normEmail=s=>String(s||'').trim().toLowerCase();
const maskId=s=>{s=String(s||'');return s.length>2?'•'.repeat(Math.min(6,s.length-2))+s.slice(-2):s};

/* ---- identity & accounts ---- */
async function initNet(){

const randHex=n=>hexOf(crypto.getRandomValues(new Uint8Array(n)));
async function dekFromHex(h){return crypto.subtle.importKey('raw',Uint8Array.from(h.match(/../g).map(x=>parseInt(x,16))),{name:'AES-GCM'},false,['encrypt','decrypt'])}
async function makeAccount(email,name,role,password,dekHex){
  const salt=randHex(16);const kek=await pbk(password,salt+'|kek',KEK_ITERS);
  return {email,name,role,salt,wrap:await encJ(kek,{dek:dekHex,email}),at:Date.now()};
}
async function unlockAccount(acct,password){
  const kek=await pbk(password,acct.salt+'|kek',KEK_ITERS);const o=await decJ(kek,acct.wrap);
  if(!o||o.email!==acct.email)throw new Error('bad');return o.dek;
}

/* ---- student lookup (landing page autodetect) ---- */
async function lookupStudent(input){
  if(!CFG.count||!window.crypto||!crypto.subtle)return [];
  const cands=[['i',normId(input)],['e',normEmail(input)],['n',normName(input)]].filter(([t,v])=>v.length>=3);
  for(const [t,v] of cands){
    if(t==='e'&&!v.includes('@'))continue;
    const h=await sha(CFG.salt+'|'+t+'|'+v);const list=CFG.lookup[h];if(!list)continue;
    const key=await pbk(t+'|'+v,CFG.salt+'|stu',LOOKUP_ITERS);const out=[];
    for(const c of list){try{out.push(Object.assign(await decJ(key,c),{via:t}))}catch(e){}}
    if(out.length)return out;
  }
  return [];
}
async function buildRoster(students,progress){
  const lookup={};let n=0;
  for(const st of students){
    const full={name:st.name,sid:st.sid||'',email:st.email||'',org:st.org||'',program:st.program||'',cohort:st.cohort||''};
    // typing only a NAME reveals no ID or email
    const byName={name:st.name,sid:maskId(st.sid),email:'',org:full.org,program:full.program,cohort:full.cohort};
    for(const [t,v,rec] of [['n',normName(st.name),byName],['i',normId(st.sid),full],['e',normEmail(st.email),full]]){
      if(v.length<3||(t==='e'&&!v.includes('@')))continue;
      const h=await sha(CFG.salt+'|'+t+'|'+v);const key=await pbk(t+'|'+v,CFG.salt+'|stu',LOOKUP_ITERS);
      (lookup[h]=lookup[h]||[]).push(await encJ(key,rec));
    }
    n++;if(progress&&n%5===0)progress(n,students.length);
  }
  const roster=students.length?await encJ(Sess.dek,{students}):null;
  const orgs={};students.forEach(s=>{const o=s.org||'(No school listed)';const g=orgs[o]=orgs[o]||{count:0,programs:{},cohorts:{}};g.count++;if(s.program)g.programs[s.program]=(g.programs[s.program]||0)+1;if(s.cohort)g.cohorts[s.cohort]=(g.cohorts[s.cohort]||0)+1});
  return {lookup,roster,orgs,count:students.length};
}

/* ---- CSV ---- */
function parseCSV(text){
  const rows=[];let row=[],f='',q=false;text=text.replace(/^﻿/,'');
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;else if(ch===','||ch==='\t'||ch===';'){row.push(f);f=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=ch}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
function rowsToStudents(rows){
  if(!rows.length)return {students:[],error:'The file is empty.'};
  const H=rows[0].map(h=>h.trim().toLowerCase().replace(/[^a-z]/g,''));
  const col=names=>H.findIndex(h=>names.includes(h));
  const ci={name:col(['name','fullname','studentname']),first:col(['firstname','first','givenname']),last:col(['lastname','last','surname','familyname']),
    sid:col(['studentid','id','idnumber','studentnumber','sid','studentidnumber']),email:col(['email','emailaddress','studentemail','schoolemail']),
    org:col(['school','organization','organisation','org','institution','college','university']),program:col(['program','programme','course','major','track']),
    cohort:col(['cohort','class','section','group','term','batch'])};
  if(ci.name<0&&ci.first<0)return {students:[],error:'Add a header row with at least a "name" column (or "first name" and "last name").'};
  const g=(r,i)=>i>=0?String(r[i]||'').trim():'';
  const students=rows.slice(1).map(r=>({name:ci.name>=0?g(r,ci.name):(g(r,ci.first)+' '+g(r,ci.last)).trim(),sid:g(r,ci.sid),email:g(r,ci.email),org:g(r,ci.org),program:g(r,ci.program),cohort:g(r,ci.cohort)})).filter(s=>s.name);
  return {students,error:students.length?'':'No student rows were found under the header.'};
}
const stuKey=s=>normId(s.sid)?'i'+normId(s.sid):normEmail(s.email)?'e'+normEmail(s.email):'n'+normName(s.name);

  c==='conflict'?'Someone saved a newer version. The page is reloading; try again after it loads.':c==='rate_limited'?'Too many saves just now. Wait a minute and try again.':

    <div class="line" style="justify-content:space-between"><div><div class="eyebrow">Instructor tools</div><h2 id="admT" style="color:var(--gold)">${Sess?'Manage the game':'Instructor sign-in'}</h2></div>
    ${Sess?`<span class="note">Signed in: ${esc(Sess.name||Sess.email)} · ${isMainAdmin()?'main admin':'instructor'} <button class="iconbtn" id="lgOut">Sign out</button></span>`:''}</div>
    ${body}
    <p class="note" id="admMsg" role="status" style="margin:0"></p>
    <div class="row"><button class="btn ghost" id="admClose">Close</button></div></div>`;
  $('#admClose').onclick=closeAdmin;
  const lo=$('#lgOut');if(lo)lo.onclick=signOut;

  if(lf){
    const em=$('#lgEmail'),msgEl=$('#lgMsg'),setup=$('#lgSetup'),btn=$('#lgBtn');
    const refresh=()=>{const e=normEmail(em.value);const first=MAIN_ADMINS.includes(e)&&!findAcct(e);setup.hidden=!first;btn.textContent=first?'Create password and sign in':'Sign in';
      $('#lgPass').placeholder=first?'Create a password (10+ characters)':'Password';msgEl.textContent=first?'First sign-in for this main admin email: choose a password.':''};
    em.oninput=refresh;
    lf.onsubmit=async e=>{e.preventDefault();const email=normEmail(em.value),pw=$('#lgPass').value;if(!email||!pw)return;
      btn.disabled=true;msgEl.textContent='Checking...';
      try{

        if(!acct){

          if(pw.length<10){msgEl.textContent='Use at least 10 characters.';btn.disabled=false;return}
          if(pw!==$('#lgPass2').value){msgEl.textContent='The two passwords do not match.';btn.disabled=false;return}
          if(CFG.roster||CFG.accounts.length){
            // other accounts exist: an existing admin must add this one

          const dekHex=randHex(32);const a=await makeAccount(email,'Dr. Joannes Paulus Tolentino Hernandez','admin',pw,dekHex);

    em.focus();return}
  adminBg.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{adminTab=b.dataset.tab;sfx.click();drawAdmin()});

/* keyboard shortcuts */
document.addEventListener('keydown',e=>{
  if(current!=='battle'||!B||B.locked||!B.q)return;
  if(e.target&&e.target.tagName==='INPUT')return;
  if(B.q.t==='mc'&&/^[1-4]$/.test(e.key)){const b=document.querySelector(`.opt[data-k="${+e.key-1}"]:not(:disabled)`);if(b)b.click()}
  if(B.q.t==='tf'&&(e.key==='t'||e.key==='f')){const b=document.querySelector(`.opt[data-v="${e.key==='t'}"]`);if(b)b.click()}
});

/* =========================================================
   BOOT (keeps progress across live updates)
   ========================================================= */
function start(data){
  const saved=load();
  if(data&&data.S&&data.S.v===2)S=data.S;else if(saved)S=saved;
  if(!S.createdAt)S.createdAt=Date.now();
  hud();
  if(S.hero&&data&&data.screen==='map')renderMap();else renderTitle();
  if(!applyAdmin()&&checkExpiry())hud();
  openingGate();
  initNet();resumeSession().then(()=>{if(Sess){try{if(sessionStorage.getItem(KEY+'.adminTab')){openAdmin()}}catch(e){}}});
}
try{window.claude?.hot?.snapshot?.(()=>({S,screen:S.hero&&current!=='title'?'map':'title'}))}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
